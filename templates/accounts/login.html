{% extends "base.html" %}
{% block title %}Sign in — EarlyAlert{% endblock %}
{% block content %}
  <h1>Sign in</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" class="stack">
    {% csrf_token %}
    <label>Username<br><input type="text" name="username" value="{{ username }}" autofocus required></label>
    <label>Password<br><input type="password" name="password" required></label>
    <button type="submit">Sign in</button>
  </form>
{% endblock %}
